#
# Stapeln service definition for wokelang
#
# Usage:
#   podman-compose -f selur-compose.toml up -d
#   just stack-up

[project]
name = "wokelang"

[services.wokelang]
build = { context = ".", dockerfile = "Containerfile" }
image = "wokelang:latest"
restart = "unless-stopped"
networks = ["default"]
security_opt = ["no-new-privileges:true"]
healthcheck = { test = ["CMD", "wokelang", "--version"], interval = "30s", timeout = "5s", retries = 3 }

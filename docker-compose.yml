# WokeLang Docker Compose - Security-hardened deployment
# Integrates with Svalinn (security), Vordr (guardian), Selur (layer), Cerro-Torre (orchestration)

version: '3.8'

services:
  wokelang:
    build:
      context: .
      dockerfile: Containerfile
    image: wokelang:latest
    container_name: wokelang

    # Security hardening
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined  # Adjust based on needs

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

    # Read-only root filesystem
    read_only: true

    # Temporary filesystems for runtime
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/tmp:noexec,nosuid,size=50m

    # Drop all capabilities, add only what's needed
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID

    # Non-root user
    user: "1000:1000"

    # Health check
    healthcheck:
      test: ["CMD", "woke", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

    # Volumes for WokeLang programs
    volumes:
      - ./examples:/workspace:ro
      - wokelang-cache:/home/wokelang/.cache

    # Environment
    environment:
      - RUST_LOG=info
      - WOKELANG_SAFE_MODE=1

    # Network
    networks:
      - wokelang-net

    # Restart policy
    restart: unless-stopped

  # Svalinn security monitor (placeholder - integrate when repo available)
  # svalinn:
  #   image: svalinn:latest
  #   depends_on:
  #     - wokelang
  #   networks:
  #     - wokelang-net

  # Vordr guardian service (placeholder - integrate when repo available)
  # vordr:
  #   image: vordr:latest
  #   depends_on:
  #     - wokelang
  #   networks:
  #     - wokelang-net

volumes:
  wokelang-cache:
    driver: local

networks:
  wokelang-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
